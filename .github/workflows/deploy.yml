name: Deploy AWS Portfolio

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::561945082889:role/GitHubPortfolioDeploymentPolicy
          aws-region: us-east-1

      - name: Deploy website to S3
        run: aws s3 sync site/ s3://gareth-waygood-aws-portfolio --delete

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id ESGCEMXMJYE0T --paths "/*"